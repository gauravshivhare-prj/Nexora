name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit-and-dependencies:
    name: Dependency Audit & Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server Lockfile Integrity (npm ci)
        run: npm ci --prefix server

      - name: Server Security Audit (High/Critical)
        run: npm audit --audit-level=high --prefix server

      - name: Client Lockfile Integrity (npm ci)
        run: npm ci --prefix client

      - name: Client Security Audit (High/Critical)
        run: npm audit --audit-level=high --prefix client

  client-build-and-test:
    name: Client Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Build Client (Vite + SRI)
        run: npm run build --prefix client

      - name: Run Client Unit Tests
        run: npm test --prefix client

  server-test:
    name: Server Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Run Server Tests
        env:
          NODE_ENV: test
          PORT: 5055
        run: |
          export JWT_SECRET=$(node -e "import('crypto').then(c => console.log(c.randomBytes(32).toString('hex')))")
          npm test --prefix server
