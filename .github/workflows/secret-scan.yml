name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSL -o "$ASSET" "${BASE}/${ASSET}"
          curl -sSL -o checksums.txt "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # Verify archive integrity before extracting
          EXPECTED=$(grep "$ASSET" checksums.txt | awk '{ print $1 }')
          ACTUAL=$(sha256sum "$ASSET" | awk '{ print $1 }')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch for $ASSET"
            exit 1
          fi

          tar -xzf "$ASSET" gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f "$ASSET" checksums.txt

      - name: Scan full history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
