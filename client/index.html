<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexora — AI-powered career readiness and employability platform for students."
    />
    <meta name="theme-color" content="#EA580C" />
    <title>Nexora — Career Readiness Platform</title>

    <!--
      Theme, applied before the first paint.

      This has to run here rather than in React: by the time a component
      mounts, the browser has already painted the light theme, and a visitor
      who chose dark sees a white flash on every navigation. Blocking and
      inline is the point — it is a few microseconds of attribute setting
      against a visible flash.

      Kept to the smallest thing that can be correct, and deliberately
      duplicating only the storage key and the resolution rule from
      src/theme/themeStorage.js, where both are documented. The try/catch is
      for browsers that reject storage access: no theme is better than no app.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('nexora.theme');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;

          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
